# Builds the app for Windows, Linux and macOS. On a v* tag the builds are attached to that tag's release.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: NSMBW-Profiler.exe
          - os: ubuntu-22.04
            file: NSMBW-Profiler-linux
          - os: macos-latest
            file: NSMBW-Profiler-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - name: Build
        shell: bash
        run: |
          python -m PyInstaller --onefile --windowed --name NSMBW-Profiler run.py
          case "${{ matrix.os }}" in
            windows-*) ;;
            ubuntu-*) mv dist/NSMBW-Profiler "dist/${{ matrix.file }}" ;;
            macos-*) (cd dist && zip -r "${{ matrix.file }}" NSMBW-Profiler.app) ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes ""
          gh release upload "${GITHUB_REF_NAME}" "dist/${{ matrix.file }}" --clobber
